<!doctype html>
<!--
  TikTok 用「相性いい人TOP3」動画の中身（1080×1920・縦）。
  window.render(秒) を呼ぶと、その時刻の1コマを描く。record.mjs がこれを1コマずつ撮って動画にする。
  相性の点数と文章は、アプリの相性の計算（src/pairing.ts）で 春の浅瀬の人と16タイプ全員の恋愛の相性を読んだ実際の結果（上位3つ）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Zen; font-weight: 500; src: url(../../assets/fonts/ZenMaruGothic-500.woff2); }
  @font-face { font-family: Zen; font-weight: 700; src: url(../../assets/fonts/ZenMaruGothic-700.woff2); }
  @font-face { font-family: Zen; font-weight: 900; src: url(../../assets/fonts/ZenMaruGothic-900.woff2); }
  :root { --gold: #eacc8c; --pink: #f6a9c4; --ink: #0b1224; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: Zen, 'Yu Gothic', sans-serif; color: #fff; font-weight: 900; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .center { left: 0; right: 0; text-align: center; }
  .shadow { text-shadow: 0 6px 24px rgba(0,0,0,.65), 0 2px 4px rgba(0,0,0,.6); }
  #bg { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; background: url(../../assets/art/ritual-bg.webp) center/cover; }
  #tint { position: absolute; inset: 0; }
  .heart { position: absolute; color: var(--pink); font-weight: 900; }
  .rank { position: absolute; left: 0; right: 0; text-align: center; }
  .rank .no { font-size: 150px; line-height: 1; color: var(--gold); }
  .rank img { width: 520px; height: 520px; display: block; margin: 0 auto; filter: drop-shadow(0 20px 34px rgba(0,0,0,.55)); }
  .rank .band { font-size: 84px; }
  .rank .sub { font-size: 46px; font-weight: 700; color: #dfe6f5; margin-top: 4px; }
  .rank .sc { font-size: 64px; color: var(--pink); margin-top: 26px; }
  .rank .sc b { font-size: 150px; color: var(--gold); line-height: 1; }
  .card { position: absolute; width: 440px; text-align: center; }
  .card .who { display: inline-block; font-size: 46px; padding: 8px 34px; border-radius: 40px; background: rgba(11,18,36,.7); border: 3px solid; }
  .card img { width: 440px; height: 440px; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)); }
  .card .band { font-size: 64px; margin-top: -10px; }
  .card .sub { font-size: 40px; font-weight: 700; color: #dfe6f5; margin-top: 6px; }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--gold); }
  .bar { position: absolute; left: 150px; width: 780px; }
  .bar .lab { font-size: 54px; display: flex; justify-content: space-between; align-items: baseline; }
  .bar .track { height: 26px; border-radius: 13px; background: rgba(255,255,255,.16); margin-top: 14px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 13px; }
  #search { position: absolute; left: 110px; width: 860px; height: 128px; border-radius: 64px; background: rgba(255,255,255,.95); color: #1b2233; display: flex; align-items: center; padding: 0 44px; font-size: 62px; gap: 26px; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  #caret { display: inline-block; width: 5px; height: 66px; background: #2f6bff; margin-left: 4px; vertical-align: middle; }
  #flash { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="tint"></div>
  <div class="layer" id="hearts"></div>

  <!-- ① フック -->
  <div class="layer" id="s1">
    <div class="abs center shadow" id="h1" style="top:480px;font-size:92px">春の浅瀬タイプの</div>
    <div class="abs center shadow" id="h2" style="top:600px;font-size:128px;color:var(--pink)">恋愛の相性</div>
    <div class="abs center shadow" id="h3" style="top:790px;font-size:150px;color:var(--gold)">TOP3</div>
    <img class="abs" id="h5" src="../../assets/art/resident-01.webp" style="left:290px;top:1010px;width:500px;height:500px;filter:drop-shadow(0 20px 34px rgba(0,0,0,.55))">
    <div class="abs center shadow" id="h4" style="top:1530px;font-size:68px">あなたの運命の人は？</div>
  </div>
  <!-- ② ランキング -->
  <div class="layer" id="s2">
    <div class="abs center shadow" id="cap2a" style="top:200px;font-size:60px;color:var(--gold)">春の浅瀬タイプ × 16タイプ</div>
    <div class="abs center shadow" id="cap2b" style="top:285px;font-size:74px">恋愛の相性ランキング</div>
    <div class="rank shadow" id="rk" style="top:430px">
      <div class="no" id="rno">3位</div>
      <img id="rimg" src="../../assets/art/resident-07.webp">
      <div class="band" id="rband">夏の沖合</div>
      <div class="sub" id="rsub">遠くへ旗を掲げる人</div>
      <div class="sc">恋愛 <b id="rsc">89</b> 点</div>
    </div>
  </div>
  <div class="layer" id="rings"></div>
  <!-- ③ 1位のひとこと -->
  <div class="layer" id="s4">
    <div class="abs center shadow" id="k4" style="top:0;opacity:0"></div>
    <div class="abs center shadow" id="lv" style="top:1620px;font-size:66px;color:var(--pink);white-space:nowrap">♡ ぴったり <span style="color:var(--gold)">★★★★★</span> ♡</div>
  </div>
  <!-- ④ つなぎ -->
  <div class="layer" id="s5">
    <div class="abs center shadow" id="k5" style="top:640px;font-size:92px">あなたのタイプは</div>
    <div class="abs center shadow" id="k5b" style="top:790px;font-size:112px;color:var(--pink)">どれだった？</div>
    <div class="abs center shadow" id="k5c" style="top:980px;font-size:62px;font-weight:700;line-height:1.5;color:#e6ecf8">生年月日と名前だけで<br>16タイプ全員との相性が出る</div>
  </div>

  <!-- ⑤ 締め：App Store で検索 -->
  <div class="layer" id="s6">
    <div class="abs center shadow" id="c0" style="top:230px;font-size:72px">あなたのタイプも、</div>
    <div class="abs center shadow" id="c1" style="top:330px;font-size:72px;color:var(--pink)">いますぐ占ってみて</div>
    <img class="abs" id="icon" src="../../assets/art/app-icon.png" style="left:340px;top:470px;width:400px;height:400px;border-radius:90px;box-shadow:0 20px 50px rgba(0,0,0,.6)">
    <div class="abs center shadow" id="c2" style="top:910px;font-size:132px">潮環占い</div>
    <div class="abs center shadow" id="c3" style="top:1090px;font-size:62px;color:var(--gold)">App Storeで検索</div>
    <div id="search" style="top:1190px">
      <svg width="58" height="58" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#8a93a6" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="#8a93a6" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span><span id="typed"></span><span id="caret"></span></span>
    </div>
    <div class="abs center shadow" id="c4" style="top:1360px;font-size:50px;font-weight:700;color:#dfe6f5">無料でダウンロード</div>
  </div>

  <div id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// 場面の表示区間（秒）
const T = { s1: [0, 3.3], s2: [3.3, 13.6], s4: [9.7, 13.6], s5: [13.6, 15.8], s6: [15.8, 20.0] };
const DURATION = 20.0;
const vis = (t, [a, b], fin = .25, fout = .25) => clamp(Math.min(seg(t, a, a + fin), 1 - seg(t, b - fout, b)));
// ポンと出る文字
function pop(el, t, at, dur = .45, rise = 40) {
  const p = seg(t, at, at + dur);
  el.style.opacity = clamp(p * 2.2);
  el.style.transform = `translateY(${(1 - outCubic(p)) * rise}px) scale(${.6 + .4 * outBack(p)})`;
}

// 浮かぶハート（決まった配置で、毎回同じ動き）
const HEARTS = Array.from({ length: 16 }, (_, i) => ({ x: (i * 271) % 1000 + 20, s: 40 + (i * 37) % 70, sp: 90 + (i * 53) % 120, ph: (i * 0.61) % 1, sw: 20 + (i * 13) % 40 }));
const heartEls = HEARTS.map(() => { const d = document.createElement('div'); d.className = 'heart'; d.textContent = '♡'; $('hearts').appendChild(d); return d; });
const RINGS = Array.from({ length: 5 }, () => { const d = document.createElement('div'); d.className = 'ring'; $('rings').appendChild(d); return d; });

window.render = function (t) {
  // 背景はずっとゆっくり寄る
  $('bg').style.transform = `scale(${1 + .06 * t / DURATION}) translateY(${-t * 3}px)`;
  const warm = vis(t, [8.6, 13.4], .2, .4);
  $('tint').style.background = `linear-gradient(180deg, rgba(11,18,36,.55), rgba(11,18,36,.35) 40%, rgba(40,10,40,${.35 + .25 * warm}))`;

  // ハートは「恋」の場面（フックと結果）で強く出す
  const hv = Math.max(vis(t, T.s1, .2, .4), .25 * vis(t, T.s2), vis(t, T.s4, .3, .4));
  HEARTS.forEach((h, i) => {
    const y = 1920 - ((t * h.sp + h.ph * 2100) % 2100);
    const el = heartEls[i];
    el.style.left = (h.x + Math.sin(t * 1.3 + i) * h.sw) + 'px'; el.style.top = y + 'px';
    el.style.fontSize = h.s + 'px'; el.style.opacity = hv * (.35 + .4 * ((i % 3) / 2));
  });

  // ① フック
  $('s1').style.opacity = vis(t, T.s1, .01, .3);
  pop($('h1'), t, .05); pop($('h2'), t, .3); pop($('h3'), t, .7, .5, 60);
  $('h3').style.transform += ' scale(' + (1 + .06 * Math.max(0, Math.sin(t * 7.5)) * seg(t, 1.2, 1.5)) + ')';
  const hp = seg(t, 1.0, 1.6); $('h5').style.opacity = hp; $('h5').style.transform = 'translateY(' + ((1 - outCubic(hp)) * 60 + Math.sin(t * 3) * 8) + 'px)';
  pop($('h4'), t, 2.0);

  // ② ランキング（3位→2位→1位）
  $('s2').style.opacity = vis(t, T.s2, .2, .3);
  pop($('cap2a'), t, 3.4); pop($('cap2b'), t, 3.6);
  const R = [
    { at: 4.0, no: '3位', img: '07', band: '夏の沖合', sub: '遠くへ旗を掲げる人', sc: 89 },
    { at: 6.9, no: '2位', img: '06', band: '夏の沿岸', sub: '港に火を灯す人', sc: 92 },
    { at: 9.8, no: '1位', img: '05', band: '夏の浅瀬', sub: '波打ち際の呼び声', sc: 94 },
  ];
  let cur = R[0]; R.forEach(x => { if (t >= x.at) cur = x; });
  if ($('rno').textContent !== cur.no) {
    $('rno').textContent = cur.no; $('rimg').src = '../../assets/art/resident-' + cur.img + '.webp';
    $('rband').textContent = cur.band; $('rsub').textContent = cur.sub;
  }
  const lt = t - cur.at, lp = seg(lt, 0, .5), isOne = cur.no === '1位';
  const lastOut = 1 - seg(t, 13.3, 13.6);
  $('rk').style.opacity = (t < 4.0 ? 0 : clamp(lp * 2)) * lastOut;
  $('rk').style.transform = 'translateX(' + ((1 - outCubic(lp)) * 200) + 'px) scale(' + (isOne ? 1 + .04 * Math.sin(t * 3) : 1) + ')';
  $('rno').style.color = isOne ? '#ffd86b' : 'var(--gold)'; $('rno').style.fontSize = isOne ? '190px' : '150px';
  $('rsc').textContent = Math.round(cur.sc * outCubic(seg(lt, .3, 1.2)));
  RINGS.forEach((r, i) => {
    const p = seg(t, 9.8 + i * .3, 9.8 + i * .3 + 1.3), size = 120 + 1100 * outCubic(p);
    Object.assign(r.style, { width: size + 'px', height: size + 'px', left: (540 - size / 2) + 'px', top: (900 - size / 2) + 'px', opacity: (p > 0 && p < 1) ? (1 - p) * .9 : 0 });
  });
  $('flash').style.opacity = [4.0, 6.9].reduce((m, x) => Math.max(m, Math.max(0, 1 - Math.abs(t - x) / .18) * .3), 0) + Math.max(0, 1 - Math.abs(t - 9.8) / .22) * .8 + Math.max(0, 1 - Math.abs(t - 15.8) / .18) * .35;

  // ③ 1位のひとこと
  $('s4').style.opacity = vis(t, T.s4, .2, .3);
  pop($('k4'), t, 9.9); pop($('lv'), t, 10.6);

  // ④ つなぎ
  $('s5').style.opacity = vis(t, T.s5, .2, .3);
  pop($('k5'), t, 13.7); pop($('k5b'), t, 13.95); pop($('k5c'), t, 14.5, .6, 30);

  // ⑤ 締め
  $('s6').style.opacity = vis(t, [T.s6[0], 99], .15, .3);
  pop($('c0'), t, 15.9); pop($('c1'), t, 16.1);
  const ip = seg(t, 16.0, 16.6);
  $('icon').style.opacity = clamp(ip * 2); $('icon').style.transform = 'scale(' + (.4 + .6 * outBack(ip)) + ') rotate(' + ((1 - outCubic(ip)) * -12) + 'deg)';
  pop($('c2'), t, 16.4, .5, 50); pop($('c3'), t, 16.9);
  const sp = seg(t, 17.0, 17.35);
  $('search').style.opacity = sp; $('search').style.transform = 'translateY(' + (1 - outCubic(sp)) * 40 + 'px)';
  const word = '潮環占い', k = Math.floor(clamp((t - 17.4) / .28, 0, word.length));
  $('typed').textContent = word.slice(0, k);
  $('caret').style.opacity = (Math.floor(t * 2.4) % 2 === 0 || (t > 17.4 && t < 18.6)) ? 1 : 0;
  const tap = seg(t, 18.7, 18.95);
  $('search').style.boxShadow = '0 16px 40px rgba(0,0,0,.45), 0 0 0 ' + (10 * Math.sin(Math.PI * tap)) + 'px rgba(234,204,140,.8)';
  pop($('c4'), t, 18.6);
};
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode()))).then(() => true);
render(0);
</script>
</body>
</html>
